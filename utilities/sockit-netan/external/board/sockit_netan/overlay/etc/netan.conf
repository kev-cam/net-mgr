# netan.conf — site/board settings for the net-analyzer, sourced by
# net-analyzer and netan-iperf. Every knob is optional: with NO file at all the
# tools auto-detect an interface, keep the NIC's real MAC, label reports
# "netan@<hostname>", and skip net-chat. This file pins the SoCKit appliance
# identity so its behaviour and reports are unchanged from before netan went
# portable.

# Interface to analyze. Empty => auto-detect (first non-loopback iface,
# preferring one already carrying link).
NETAN_IFACE=eth0

# Force this MAC onto the interface (locally administered, "SOCKI") so the DHCP
# server and net-mgr naming see a stable address across power-cycles. Leave
# EMPTY on any host whose real network identity you must not disturb.
NETAN_MAC=02:53:4f:43:4b:49

# DHCP hostname advertised in the lease (shows in the server's logs and the
# net-mgr dnsmasq event bridge).
NETAN_HOSTNAME=sockit-netan

# Prefix on every report line (console + net-chat).
NETAN_LABEL=SoCKit-netan

# net-chat sink(s), best effort — reports spool to tmpfs if unreachable.
# nas3: DMZ .15.104, secure .223.220. Empty => net-chat disabled entirely.
NETAN_CHAT_HOSTS="192.168.15.104 192.168.223.220"
NETAN_CHAT_PORT=7531
NETAN_CHAT_SESSION=Net-Mgr
# unverified:dkc is a Net-Mgr member; after `net-chat allow Net-Mgr
# unverified:sockit`, switch this to "sockit".
NETAN_CHAT_AS=dkc

# iperf mode: server(s) tried before scanning the /24 (nas3 runs iperf3).
NETAN_IPERF_PREFERRED="192.168.15.104 192.168.223.220"
