# SD layout for Cyclone V HPS boot:
#  p1  type 0xA2 (raw, BootROM scans for it)  u-boot-with-spl.sfp (SPL x4 + U-Boot)
#  p2  FAT, bootable                          zImage + dtb + extlinux/extlinux.conf
#  p3  ext4                                   rootfs
# No offset on p1 — mirrors buildroot's proven DE10-Nano layout (first partition
# right after the MBR). An explicit 1M offset was tried and the BootROM stayed
# silent; do not reintroduce it. (Cost: a saveenv at 0x4400 would land inside
# the SPL image area — we never saveenv.)

image boot.vfat {
	vfat {
		file zImage { image = "zImage" }
		file socfpga_cyclone5_sockit.dtb { image = "socfpga_cyclone5_sockit.dtb" }
		file extlinux/extlinux.conf { image = "extlinux.conf" }
	}
	size = 32M
}

image sdcard.img {
	hdimage {
	}
	partition spl {
		partition-type = 0xA2
		image = "u-boot-with-spl.sfp"
		size = 1M
	}
	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}
	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
